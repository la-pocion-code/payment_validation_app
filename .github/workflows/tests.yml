# Corre la suite contra PostgreSQL (la misma base que producción) en cada push y PR
# a staging y main. Railway despliega al recibir el push; para que ESPERE a que esto
# pase, activar «Wait for CI» en el servicio (Settings → Source).
name: Pruebas

on:
  push:
    branches: [main, staging, mejoras-plataforma]
  pull_request:
    branches: [main, staging]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pagos
          POSTGRES_PASSWORD: pagos
          POSTGRES_DB: pagos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pagos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: solo-para-ci
      DEBUG: 'False'
      DATABASE_URL: postgres://pagos:pagos@localhost:5432/pagos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Las migraciones están al día
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test
