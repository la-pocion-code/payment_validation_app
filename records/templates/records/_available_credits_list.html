{% load humanize %}
{% if credits %}
<section class="pv-card" style="margin-top: 16px;">
    <div class="pv-card__head">
        <h2>Abonos disponibles del cliente</h2>
        <span class="pv-card__hint">Marca los que quieras aplicar a esta venta</span>
    </div>
    <div class="pv-card__body available-credits-list">
        {% for credit in credits %}
        <label class="pv-credit-option" for="apply_credit_{{ credit.pk }}">
            <input class="pv-checkbox apply-credit-checkbox"
                   type="checkbox"
                   name="apply_credit"
                   value="{{ credit.pk }}"
                   data-value="{{ credit.valor|stringformat:'f' }}"
                   id="apply_credit_{{ credit.pk }}">
            <span>
                <span class="pv-mono">{{ credit.comprobante }}</span>
                <span class="pv-muted">· {{ credit.fecha|date:'d/m/Y' }} · {{ credit.payment_status }}</span>
            </span>
            <strong>${{ credit.valor|floatformat:2|intcomma }}</strong>
        </label>
        {% endfor %}
    </div>
</section>
{% endif %}
